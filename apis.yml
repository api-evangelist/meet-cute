description: Meet Cute is a New York-based media company founded in 2019 by Naomi Shah that produces
  and distributes original scripted romantic-comedy audio programming, releasing bite-sized 15-minute
  rom-com stories as podcasts across platforms such as Apple Podcasts and Spotify. Backed by Union Square
  Ventures, Lerer Hippeau, Advancit Capital, and LocalGlobe, the company was acquired by Fox Entertainment
  in November 2025 to serve as a rapid-development content incubator for scripted and unscripted series.
  Meet Cute is a consumer media/content brand with no public developer API, documentation, or developer
  portal; this profile is retained as a company record.
